name: Build Android (production)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        # `npm ci` (lockfile-exact), NOT `npm install`. Keeps the native
        # fingerprint this build computes consistent with the OTA workflow
        # so EAS Update RVs match the build's runtimeVersion.
        run: npm ci

      - name: Build Android app bundle via EAS
        working-directory: ./frontend
        # production profile → .aab on the `production` channel (store
        # distribution, autoIncrement versionCode), which is what the
        # Google Play alpha track wants and what receives production OTAs.
        # The preview profile (APK, `preview` channel) was wrong for this.
        run: eas build --platform android --profile production --non-interactive --wait
