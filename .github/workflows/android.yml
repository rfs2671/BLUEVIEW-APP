name: Build Android (production)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          # PINNED TO THE MAJOR, not floating on latest. On 2026-08-25
          # latest resolved to eas-cli 22.4.0, whose dependency
          # @oclif/plugin-autocomplete@3.3.0 requires node >=22, and the
          # job died before publishing anything. Nothing in the repo had
          # changed - green on the 24th, red on the 25th.
          #
          # 22.x still takes patches and minors, so server-side
          # deprecations of an old client stay a slow problem rather than
          # a frozen one. What it stops is a MAJOR landing unannounced.
          # Bump deliberately when EAS asks for it.
          eas-version: '22.x'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        # `npm ci` (lockfile-exact), NOT `npm install`. Keeps the native
        # fingerprint this build computes consistent with the OTA workflow
        # so EAS Update RVs match the build's runtimeVersion.
        run: npm ci

      - name: Build Android app bundle via EAS
        working-directory: ./frontend
        # production profile → .aab on the `production` channel (store
        # distribution, autoIncrement versionCode), which is what the
        # Google Play alpha track wants and what receives production OTAs.
        # The preview profile (APK, `preview` channel) was wrong for this.
        run: eas build --platform android --profile production --non-interactive --wait
