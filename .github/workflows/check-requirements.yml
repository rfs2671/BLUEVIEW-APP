# Phase C2.2 — clean-venv resolution check on every requirements.txt PR.
#
# Catches the class of bug that took production down between C2 and
# C2.1: a transitive cap from a newly-added package conflicts with
# an existing hard pin. The conflict is invisible on every developer
# machine (their venvs already had the prior packages installed
# and pip never re-resolves on top of an existing install) but
# manifests on Railway's clean Docker image.
#
# The pre-commit hook (.githooks/pre-commit) is the local
# safety net; this workflow is the merge gate for anyone who
# disables their hooks or commits via the GitHub UI.
#
# Same check, same expected output:
#
#     pip install --dry-run -r requirements.txt -c backend/constraints.txt
#     # → ResolutionImpossible blocks the merge.
#     # → success allows it through.
#
# WITH THE CONSTRAINTS, because the Dockerfile installs with them. A pin in
# constraints.txt that conflicts with a requirement is the C2 → C2.1 failure
# exactly, and a dry run without -c resolves it green and leaves the Docker
# build to find it.
#
# The workflow runs ONLY when the PR touches requirements.txt, the
# constraints, or this file (path filter), so the rest of the CI fleet
# stays cheap.

name: Check requirements.txt resolution

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'backend/requirements.txt'
      - 'backend/constraints.txt'
      # A change to this check must prove itself on its own PR.
      - '.github/workflows/check-requirements.yml'
  # Manual trigger so an operator can re-run after fixing a bad
  # requirements.txt edit without pushing a new commit.
  workflow_dispatch: {}

# One run per branch: a rebase or force-push supersedes the run it replaces.
# PR-triggered only -- see the note in tests.yml on why the OTA publish and the
# post-deploy checks must never be cancellable.
concurrency:
  group: check-requirements-${{ github.ref }}
  # CANCEL A SUPERSEDED PR RUN, NEVER A MAIN-PUSH RUN. This workflow also
  # runs on a push to main, and since tests.yml no longer does, these are
  # the only post-merge verification left -- a second merge landing quickly
  # must not cancel the first merge's check and leave it unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: pip install --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        # The image's minor (Dockerfile: FROM python:3.12-slim), so
        # wheel availability and environment markers resolve as they
        # do in the build. If the base image moves, move this with it;
        # test_ci_installs_what_production_installs fails until you do.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate requirements.txt
        id: locate
        run: |
          if [ -f "requirements.txt" ]; then
            echo "path=requirements.txt" >> "$GITHUB_OUTPUT"
          elif [ -f "backend/requirements.txt" ]; then
            echo "path=backend/requirements.txt" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: no requirements.txt found at root or backend/."
            exit 1
          fi

      - name: Create clean venv
        run: |
          python -m venv /tmp/req_check_venv
          /tmp/req_check_venv/bin/pip install --upgrade --quiet pip

      - name: Dry-run pip install
        run: |
          set -eo pipefail
          /tmp/req_check_venv/bin/pip install \
            --dry-run \
            -r "${{ steps.locate.outputs.path }}" \
            -c backend/constraints.txt

      - name: Success
        if: success()
        run: echo "✓ requirements.txt resolves cleanly"
