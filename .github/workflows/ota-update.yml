name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/app/**'
      - 'frontend/src/**'
      - 'frontend/App.js'
      - 'frontend/app.json'
      - 'frontend/package.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        # MUST be `npm ci` (deterministic, from package-lock.json), NOT
        # `npm install`. EAS Build installs from the lockfile, so the
        # native fingerprint it computes (the build's runtimeVersion)
        # is locked to the resolved tree. `npm install` here can resolve
        # different transitive versions, changing the node_modules files
        # that feed @expo/fingerprint — which made `eas update` publish
        # under a DIFFERENT runtimeVersion than the build, so no installed
        # build ever matched the OTA. `npm ci` aligns CI with EAS Build.
        run: npm ci

      - name: Publish update
        working-directory: ./frontend
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Truncate to first line and sanitize for shell safety
          MSG=$(echo "$COMMIT_MSG" | head -1 | tr -d '"' | cut -c1-100)
          eas update --branch production --message "$MSG"
