name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/app/**'
      - 'frontend/src/**'
      - 'frontend/App.js'
      - 'frontend/app.json'
      # The config that injects the commit into the bundle. Without it here a
      # change to the injection itself would not trigger a publish, so the fix
      # would sit on main unshipped — the exact failure the build card exists
      # to make visible.
      - 'frontend/app.config.js'
      - 'frontend/package.json'

  # MANUALLY INVOCABLE, and this is the real finding from 2026-08-25.
  #
  # The publish for #201 died in Setup Expo before it ran. The fix went in as
  # a workflow-only change, which does NOT match the paths above, so the
  # corrected pipeline sat on main with no way to invoke it and the bundle
  # stayed unpublished. A publish pipeline that can only be triggered by a
  # qualifying commit cannot be used to RECOVER from its own failure - the
  # only remedies left were inventing a no-op commit or bypassing CI from a
  # laptop, and both are worse than a button.
  workflow_dispatch:
    inputs:
      # THE EAS BRANCH TO PUBLISH TO. Was hardcoded `production` in the run
      # step below, which meant workflow_dispatch could choose a git REF but
      # not a destination -- so the only way to put an unmerged branch on a
      # phone was to publish it to the branch every store install listens on.
      # That is not a testing path, it is a production release with extra
      # steps, and it is why this input exists.
      #
      # DEFAULT STAYS `production`, deliberately. The push trigger above is the
      # normal path and must keep working unchanged; the input is here to make
      # publishing somewhere ELSE possible and deliberate, not to make it easy.
      #
      # ⚠️ CHANNEL `preview` MAY NOT EXIST YET, AND A PUBLISH TO IT WOULD LAND
      #    WHERE NOTHING IS LISTENING.
      #
      #    eas.json defines a `preview` build profile on channel `preview`,
      #    but nothing in this repo has ever built it: android.yml runs
      #    `--profile production` only, and its own comment says "The preview
      #    profile (APK, `preview` channel) was wrong for this." EAS creates a
      #    channel, and its same-named branch, on the FIRST BUILD that uses it.
      #    So until such a build exists there is no channel `preview`, no
      #    installed app pointing at it, and an update published there is a
      #    bundle no device will ever fetch -- which looks identical to a
      #    successful publish in this workflow's logs.
      #
      #    WHAT UNBLOCKS IT, in order:
      #      1. `eas build --platform android --profile preview` (internal APK)
      #      2. install that APK on the test device
      #      3. then this workflow with branch=preview reaches it
      #
      #    Confirm the mapping at
      #    expo.dev/accounts/rfs2671/projects/levelog/channels, or with
      #    `eas channel:view preview`, before trusting a preview publish.
      branch:
        description: 'EAS branch to publish to (production = every store install)'
        required: false
        default: 'production'
        type: string

      # THE ONE COMBINATION THAT CANNOT HAPPEN BY ACCIDENT: publishing to
      # `production` from a ref that is not main. That ships unreviewed code to
      # every CP's phone, and it is reachable by dispatching against a feature
      # branch and simply not touching the branch input above -- the dangerous
      # thing being the default is exactly how it would happen.
      #
      # NOT A HARD BLOCK, because this workflow exists to be a recovery button
      # and a hotfix ref is a real case. It is a second, explicit action.
      confirm_production_from_non_main:
        description: 'Required ONLY to publish production from a non-main ref'
        required: false
        default: false
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIRST, before Setup Node / Setup Expo / npm ci / Metro. A refused
      # publish costs seconds rather than four minutes of bundling, and
      # nothing above it can have side effects worth undoing.
      - name: Guard the destination
        env:
          EAS_BRANCH: ${{ inputs.branch || 'production' }}
          CONFIRMED: ${{ inputs.confirm_production_from_non_main }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          echo "Publishing ref '${REF}' to EAS branch '${EAS_BRANCH}'"

          if [ "$EAS_BRANCH" = "production" ] && [ "$REF" != "main" ]; then
            if [ "$CONFIRMED" != "true" ]; then
              echo "::error::Refusing to publish '${REF}' to the production EAS branch."
              echo "Every store install listens on production, so this would ship"
              echo "an unmerged ref to every phone."
              echo ""
              echo "If you are TESTING a branch, re-run with branch=preview -- but read"
              echo "the note on that input first: channel 'preview' may not exist yet."
              echo "If you are RECOVERING and this is intended, re-run with"
              echo "confirm_production_from_non_main=true."
              exit 1
            fi
            echo "::warning::Publishing non-main ref '${REF}' to production, explicitly confirmed."
          fi

          if [ "$EAS_BRANCH" != "production" ]; then
            echo "::warning::Publishing to EAS branch '${EAS_BRANCH}'. If no build has ever used the matching channel, this update reaches no device. See the branch input note."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # NODE 22, NOT 20. eas-version: latest resolved to eas-cli 22.4.0
          # on 2026-08-25, whose dependency @oclif/plugin-autocomplete@3.3.0
          # requires node >=22. The job died in Setup Expo BEFORE the
          # publish step ever ran, so the merge showed success in the PR
          # while NO BUNDLE WAS PUBLISHED. That is the worst shape of
          # failure: the phone silently keeps the previous bundle and the
          # operator reads a stale build as a failed fix.
          #
          # Nothing in the repo changed. The workflow passed on 2026-08-24
          # and failed on 2026-08-25 because a floating dependency moved.
          # GitHub also deprecated Node 20 on Actions runners.
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          # PINNED TO THE MAJOR, not floating on latest. On 2026-08-25
          # latest resolved to eas-cli 22.4.0, whose dependency
          # @oclif/plugin-autocomplete@3.3.0 requires node >=22, and the
          # job died before publishing anything. Nothing in the repo had
          # changed - green on the 24th, red on the 25th.
          #
          # 22.x still takes patches and minors, so server-side
          # deprecations of an old client stay a slow problem rather than
          # a frozen one. What it stops is a MAJOR landing unannounced.
          # Bump deliberately when EAS asks for it.
          eas-version: '22.x'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        # MUST be `npm ci` (deterministic, from package-lock.json), NOT
        # `npm install`. EAS Build installs from the lockfile, so the
        # native fingerprint it computes (the build's runtimeVersion)
        # is locked to the resolved tree. `npm install` here can resolve
        # different transitive versions, changing the node_modules files
        # that feed @expo/fingerprint — which made `eas update` publish
        # under a DIFFERENT runtimeVersion than the build, so no installed
        # build ever matched the OTA. `npm ci` aligns CI with EAS Build.
        run: npm ci

      - name: Publish update
        working-directory: ./frontend
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # Read by frontend/app.config.js into extra.jsCommit, which is what
          # the BUILD card in settings prints and compares against /api/version.
          # This is the commit being published, not the one checked out later.
          JS_COMMIT: ${{ github.sha }}
          # Empty under `push`, where inputs do not exist -- hence the fallback,
          # which keeps the normal path publishing to production unchanged.
          EAS_BRANCH: ${{ inputs.branch || 'production' }}
        run: |
          # Truncate to first line and sanitize for shell safety
          MSG=$(echo "$COMMIT_MSG" | head -1 | tr -d '"' | cut -c1-100)
          # head_commit EXISTS ONLY ON PUSH. Under workflow_dispatch the env
          # var above is empty, and eas treats an empty --message as if the
          # flag were absent:
          #
          #   --branch and --message ... are required when updating in
          #   non-interactive mode unless --auto is specified
          #
          # So the button added to recover from a failed publish failed on
          # its first use. Fall back to the checked-out commit subject, which
          # is the same string a push would have handed us.
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=%s | tr -d '"' | cut -c1-100)
          fi
          # And never reach eas with nothing: an unreadable message is a bad
          # changelog entry, an empty one is a failed publish.
          [ -n "$MSG" ] || MSG="manual dispatch ${GITHUB_SHA}"
          eas update --branch "$EAS_BRANCH" --message "$MSG"
