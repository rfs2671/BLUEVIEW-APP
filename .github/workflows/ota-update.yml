name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/app/**'
      - 'frontend/src/**'
      - 'frontend/App.js'
      - 'frontend/app.json'
      # The config that injects the commit into the bundle. Without it here a
      # change to the injection itself would not trigger a publish, so the fix
      # would sit on main unshipped — the exact failure the build card exists
      # to make visible.
      - 'frontend/app.config.js'
      - 'frontend/package.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # NODE 22, NOT 20. eas-version: latest resolved to eas-cli 22.4.0
          # on 2026-08-25, whose dependency @oclif/plugin-autocomplete@3.3.0
          # requires node >=22. The job died in Setup Expo BEFORE the
          # publish step ever ran, so the merge showed success in the PR
          # while NO BUNDLE WAS PUBLISHED. That is the worst shape of
          # failure: the phone silently keeps the previous bundle and the
          # operator reads a stale build as a failed fix.
          #
          # Nothing in the repo changed. The workflow passed on 2026-08-24
          # and failed on 2026-08-25 because a floating dependency moved.
          # GitHub also deprecated Node 20 on Actions runners.
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        # MUST be `npm ci` (deterministic, from package-lock.json), NOT
        # `npm install`. EAS Build installs from the lockfile, so the
        # native fingerprint it computes (the build's runtimeVersion)
        # is locked to the resolved tree. `npm install` here can resolve
        # different transitive versions, changing the node_modules files
        # that feed @expo/fingerprint — which made `eas update` publish
        # under a DIFFERENT runtimeVersion than the build, so no installed
        # build ever matched the OTA. `npm ci` aligns CI with EAS Build.
        run: npm ci

      - name: Publish update
        working-directory: ./frontend
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # Read by frontend/app.config.js into extra.jsCommit, which is what
          # the BUILD card in settings prints and compares against /api/version.
          # This is the commit being published, not the one checked out later.
          JS_COMMIT: ${{ github.sha }}
        run: |
          # Truncate to first line and sanitize for shell safety
          MSG=$(echo "$COMMIT_MSG" | head -1 | tr -d '"' | cut -c1-100)
          eas update --branch production --message "$MSG"
