# Every change is checked for credentials before it can merge.
#
# THE LINES A CHANGE ADDS, not the whole history -- see scripts/secret-scan.sh
# for why. History already holds one known, expired token signed with the
# production secret; the operator ruled rotation, not a rewrite, so a
# whole-history gate would be red on every PR forever and would be switched off.
#
# CHEAP ON PURPOSE. This repo's Actions minutes are budgeted: no dependencies
# are installed, and the job is a few seconds of git and grep. It runs on every
# PR regardless of path, because a secret can be pasted into any file.
#
# THE SCANNER TESTS ITSELF FIRST and refuses to report "clean" if it cannot
# find secrets it planted. The scan that found the historical token had first
# reported zero hits over 1.4M lines that provably contained matches.

name: secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the merge base, which a shallow clone may
          # not contain -- and "no base found" must never read as "no secrets".
          fetch-depth: 0

      - name: Scan the lines this change adds
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash scripts/secret-scan.sh "$BASE"
