# Test suites — the gate that was missing.
#
# Before this workflow, CI ran architectural-rules (git-grep guards) and
# backend-import-smoke (proves the server imports) — neither executes a single
# test. The 140-file / 2053-test backend suite and the frontend JS suite were
# run only by hand, so a red suite could sit on main unnoticed between
# sessions. Both had in fact rotted red at some point (a shared rate-limit
# counter saturating mid-run; a ReferenceError that killed 16 assertions before
# any ran) and were only caught by manual audit.
#
# Both suites are hermetic: no database, no network, no service containers.
# backend/tests/conftest.py os.environ.setdefault()s MONGO_URL / DB_NAME /
# JWT_SECRET / QWEN_API_KEY, and the suite is fully mock-based.
#
# DO NOT set DB_NAME (or the other four) on these jobs. conftest uses
# setdefault, and three tests in test_migrate_clear_filing_rep_credentials.py
# key their motor mock on the literal "smoke_test"; pre-setting a DIFFERENT
# value makes setdefault a no-op and those tests fail with KeyError. Letting
# conftest own the defaults is what keeps the suite green.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: backend suite (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches production (Dockerfile: python:3.12-slim, runtime.txt:
      # python-3.12.0), so CI exercises the interpreter we actually ship on.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # Full suite, not a subset. Runs from backend/ so conftest's sys.path
      # insert resolves sibling imports the same way it does locally.
      # No env block on purpose — see the header note.
      - name: Run backend suite
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-tests:
    name: frontend suite (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # THE "NO INSTALL NEEDED" PREMISE WAS TRUE, AND IS NOT ANY MORE.
      #
      # 26 of the 28 JS tests are dependency-free harnesses (fs/path only) that
      # parse real component source. Two are not: logbookViewRenderers and
      # reportPreviewPhotoIssue TRANSPILE the real JSX renderer blocks and
      # EXECUTE them — strictly stronger than grepping source, and worth
      # keeping — so they require @babel/core, which package.json has declared
      # all along.
      #
      # With no node_modules those two die on "Cannot find module
      # '@babel/core'". Nobody saw it: the runner below halts on the FIRST
      # non-zero exit, both files sort after one that was already failing, and
      # so neither had ever executed in CI even once. They passed on
      # developers' machines purely because node_modules happened to exist
      # there. That is the precise failure mode this workflow was written to
      # prevent, reproduced inside the workflow itself.
      #
      # `npm ci`, not a targeted `npm i`: with a package.json present, npm
      # resolves the whole tree anyway (measured — 987 packages either way), so
      # a targeted install buys nothing and gives up the lockfile's
      # reproducibility. Same step the mount-smoke job below already runs, and
      # the setup-node cache above keeps it short.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Globbed rather than hard-coded so a new *.test.cjs / *.test.js is
      # picked up automatically — a test nobody runs is the thing this workflow
      # exists to prevent. Fails the job on the FIRST non-zero exit, and fails
      # loudly if the glob ever matches nothing.
      - name: Run frontend JS tests
        working-directory: frontend
        run: |
          set -euo pipefail
          mapfile -t files < <(find src app -type f \( -name '*.test.cjs' -o -name '*.test.js' \) 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no frontend test files matched — the glob is stale."
            exit 1
          fi
          echo "Found ${#files[@]} test file(s):"
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            echo "--- $f"
            node "$f"
          done

  # ── Mount smoke ────────────────────────────────────────────────────────────
  # The suite above PARSES component source; it never executes a component. That
  # gap shipped a real crash: four shared components kept a reference to a
  # `styles` const that no longer existed, and the frozen-ref grep, the wiring
  # checker and both suites were all green while the app died on first paint
  # with "Something went wrong - styles is not defined".
  #
  # This job loads real routes against the production export in a real browser
  # and fails on any console error or error-boundary render. It is deliberately
  # a SEPARATE job: the suite above is dependency-free and seconds long, and
  # this one needs npm ci + a Chromium download + an expo export (~5 min). Do
  # not merge them.
  frontend-mount-smoke:
    name: frontend mount smoke (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # playwright-core is NOT a project dependency (nothing else needs a
      # browser); install it and the matching Chromium for this job only.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm i --no-save playwright-core@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Build production web bundle
        working-directory: frontend
        run: npx expo export --platform web --output-dir dist

      - name: Mount every route, fail on console errors
        working-directory: frontend
        run: node scripts/smoke-mount.cjs --dist dist --port 5810
