# Test suites — the gate that was missing.
#
# Before this workflow, CI ran architectural-rules (git-grep guards) and
# backend-import-smoke (proves the server imports) — neither executes a single
# test. The 140-file / 2053-test backend suite and the frontend JS suite were
# run only by hand, so a red suite could sit on main unnoticed between
# sessions. Both had in fact rotted red at some point (a shared rate-limit
# counter saturating mid-run; a ReferenceError that killed 16 assertions before
# any ran) and were only caught by manual audit.
#
# Both suites are hermetic: no database, no network, no service containers.
# backend/tests/conftest.py os.environ.setdefault()s MONGO_URL / DB_NAME /
# JWT_SECRET / QWEN_API_KEY, and the suite is fully mock-based.
#
# DO NOT set DB_NAME (or the other four) on these jobs. conftest uses
# setdefault, and three tests in test_migrate_clear_filing_rep_credentials.py
# key their motor mock on the literal "smoke_test"; pre-setting a DIFFERENT
# value makes setdefault a no-op and those tests fail with KeyError. Letting
# conftest own the defaults is what keeps the suite green.

# ── WHY THIS NO LONGER RUNS ON PUSH TO main ─────────────────────────────────
#
# It used to run on the PR *and* again on the squash. 93 of the 256 runs in one
# six-day window were that second run, at 16.4 billable minutes each -- about
# 6,900 minutes a month re-testing a tree the PR had already tested.
#
# It is safe to drop ONLY because of the merge rule this repo already follows:
# `git merge-base --is-ancestor origin/main <branch>` before every merge, so a
# PR's green CI ran on a head that CONTAINED current main. A squash of that head
# is the same tree. The residual risk is two PRs that are each green alone and
# semantically conflict once both are in -- git reports no conflict and nothing
# re-tests the combination. That is the trade the operator accepted; the
# ancestry rule is what keeps the window to a single merge.
#
# ── WHY EACH SUITE ASKS WHAT CHANGED ────────────────────────────────────────
#
# The mount smoke is roughly half the cost of a run and cannot be affected by a
# backend-only change; the backend suite cannot be affected by a frontend-only
# one. The `changes` job answers both questions once, in about ten seconds, with
# git -- NOT with a third-party paths-filter action, which would add a
# supply-chain dependency to the gate that guards the repo.
#
# A WORKFLOW-LEVEL `paths:` FILTER WOULD NOT DO. It decides whether the whole
# workflow runs, so it cannot skip the mount smoke while still running pytest,
# and the skipped run reports nothing at all. This keeps one workflow that
# always reports and gates the expensive jobs inside it.
#
# THERE IS NO BRANCH PROTECTION ON THIS REPO (it needs GitHub Pro), so a skipped
# job cannot leave a required check pending forever. If protection is ever
# enabled, these `if:` guards must become required-check exemptions or the
# skips will block merges.

name: tests

on:
  pull_request:
    # ready_for_review IS NOT A DEFAULT TYPE, AND THE DRAFT GATE BELOW NEEDS IT.
    #
    # The default set is [opened, synchronize, reopened]. Three jobs in this
    # file skip on `draft == false`, so on a draft they are reported as
    # "skipping" -- and without this line, taking that draft out of draft fires
    # an event the workflow does not listen for. The skipped runs then STAY
    # skipped until somebody happens to push again.
    #
    # WHAT THAT LOOKS LIKE ON THE PULL REQUEST IS THE PROBLEM: "skipping" is
    # not red. A ready, reviewable PR sits there with the backend suite, the
    # frontend suite and the mount smoke all showing a neutral grey tick, and
    # the merge button is green. Measured on #603: marked ready at 07:26, all
    # three still "skipping", and the only way to get a real run was to close
    # and reopen it so a `reopened` event fired.
    #
    # A gate that silently does not run is worse than no gate, because the
    # empty result is indistinguishable from a passing one at a glance.
    types: [opened, synchronize, reopened, ready_for_review]

# One run per branch. A rebase or a force-push supersedes the run it replaces,
# and tonight's train left several superseded runs burning to completion.
#
# PR WORKFLOWS ONLY. `ota-update` and the post-deploy checks run on a push to
# main and must NEVER be cancelled: cancelling an EAS publish mid-flight leaves
# every device without the bundle, and cancelling a post-deploy check destroys
# the only evidence the deploy was verified.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHAT CHANGED, ASKED ONCE. Outputs are strings 'true'/'false' because a job
  # output is always a string -- `if: needs.changes.outputs.backend == 'true'`
  # is the comparison that works, and `if: needs.changes.outputs.backend` is
  # true for the literal 'false'.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff is against the merge base, which a shallow clone may not
          # contain -- and "no base found" must never read as "nothing changed",
          # so the fallback below runs everything.
          fetch-depth: 0
      - id: f
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            echo "::warning::base $BASE not found — running every suite"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # requirements.txt, nixpacks.toml and the Dockerfile change what the
          # backend RUNS ON, so they count as backend. The workflow files
          # themselves count as both: a change to this file must prove itself.
          be=false; fe=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              backend/*|requirements*.txt|nixpacks.toml|Dockerfile|.github/workflows/*) be=true ;;
            esac
            case "$f" in
              frontend/*|.github/workflows/*) fe=true ;;
            esac
          done <<< "$files"
          echo "backend=$be"  >> "$GITHUB_OUTPUT"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "-> backend=$be frontend=$fe"

  backend-tests:
    name: backend suite (pytest)
    needs: changes
    # DOCS-ONLY CHANGES SKIP EVERY SUITE: neither flag is set, so all three
    # heavy jobs are skipped and only `changes` runs. DRAFTS SKIP TOO -- a draft
    # is work in progress by definition, and marking it ready re-runs this,
    # which is true ONLY because `ready_for_review` is in the trigger's `types`
    # at the top of this file. It was not, and this sentence was wrong for as
    # long as the gate existed. Do not remove that line.
    if: |
      needs.changes.outputs.backend == 'true'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches production (Dockerfile: python:3.12-slim, runtime.txt:
      # python-3.12.0), so CI exercises the interpreter we actually ship on.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # Full suite, not a subset. Runs from backend/ so conftest's sys.path
      # insert resolves sibling imports the same way it does locally.
      # No env block on purpose — see the header note.
      - name: Run backend suite
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-tests:
    name: frontend suite (node)
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # THE "NO INSTALL NEEDED" PREMISE WAS TRUE, AND IS NOT ANY MORE.
      #
      # Most JS tests are dependency-free harnesses (fs/path only) that parse
      # real component source. The rest TRANSPILE real JSX and EXECUTE it —
      # strictly stronger than grepping source, and worth keeping — so they
      # need @babel/core, which package.json has declared all along.
      #
      # THE COUNT IS NOT WRITTEN HERE, AND THE LAST TWO ATTEMPTS ARE WHY. This
      # comment already said "the count is deliberately not written here"
      # because "26 of the 28" went stale in a day — and then wrote one anyway
      # in the next sentence: "a closed set of two: logbookViewRenderers and
      # reportPreviewPhotoIssue". Measured 2026-09-18, it was SIXTY-SEVEN of
      # 178: forty require @babel/core directly and twenty-eight more reach it
      # through src/utils/esmHarness.cjs, which requires it on their behalf.
      # Wrong by sixty-five, in a sentence whose own subject was not writing
      # counts.
      #
      # So: the PROPERTY, and the census that re-derives it on demand.
      # A file needs node_modules if it transpiles JSX, directly or via the
      # shared harness:
      #
      #   { grep -rlE "require\(['\"]@babel/core" frontend/src frontend/app
      #     grep -rln esmHarness                   frontend/src frontend/app
      #   } | grep -E "test\.(cjs|js)$" | sort -u | wc -l
      #
      # WHAT THE INSTALL STEP BELOW IS PROTECTING. With no node_modules those
      # files die on "Cannot find module '@babel/core'" — and the last time
      # that happened nobody saw it, because the runner halts on the FIRST
      # non-zero exit and they sorted after an already-failing file. They had
      # never executed in CI even once. Removing `npm ci` as an optimisation
      # would silently stop running a THIRD of the frontend suite, and the job
      # would still look green until the first survivor failed.
      # backend/tests/test_the_js_suite_gets_its_dependencies.py asserts the
      # install step is still there and still runs before the suite.
      #
      # With no node_modules those two die on "Cannot find module
      # '@babel/core'". Nobody saw it: the runner below halts on the FIRST
      # non-zero exit, both files sort after one that was already failing, and
      # so neither had ever executed in CI even once. They passed on
      # developers' machines purely because node_modules happened to exist
      # there. That is the precise failure mode this workflow was written to
      # prevent, reproduced inside the workflow itself.
      #
      # `npm ci`, not a targeted `npm i`: with a package.json present, npm
      # resolves the whole tree anyway (measured — 987 packages either way), so
      # a targeted install buys nothing and gives up the lockfile's
      # reproducibility. Same step the mount-smoke job below already runs, and
      # the setup-node cache above keeps it short.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # REACT 19 THROWS on text outside a <Text>; React 18 only warned, so
      # these sat in the tree for months. Two were found by hand only after
      # the SDK 54 upgrade turned them into crashes: a literal ")}" left
      # behind on the daily-jobsite crew card when a conditional was
      # deleted, and a stray backslash on the worker detail screen. Nothing
      # was checking, which is why nobody knew.
      #
      # Runs BEFORE the JS suite: it is a parse-only sweep of every file, so
      # it is fast, and a crash-on-open is worth failing the job earlier
      # than an assertion is.
      - name: No text rendered outside a <Text> (React 19 throws)
        working-directory: frontend
        run: node scripts/find-bare-jsx-text.cjs

      # AND NO IDENTIFIER THAT RESOLVES TO NOTHING. app/demo.jsx used
      # `semantic.attention` while importing only `withAlpha` from the same
      # module — a ReferenceError on first render of the screen a
      # self-registered account lands on. It survived four weeks and shipped
      # in the binary Apple was reviewing, because no test executes these
      # screens and a grep cannot see a MISSING binding. Sweeping for it
      # found three more of the same shape, each waiting on a branch.
      #
      # Also parse-only, so it runs beside the <Text> sweep and before the
      # suites: a crash-on-open should fail the job earlier than an assertion.
      - name: No unbound identifiers (ReferenceError on first render)
        working-directory: frontend
        run: node scripts/find-unbound-identifiers.cjs

      # AND NO PINNED PALETTE KEY THAT NOTHING PAINTS. `outdoor` is the app's
      # light look, frozen, worn by the ten logbook editors because a CP fills
      # a compliance log in direct sun. The pin was applied to the CONTENT and
      # never to the CANVAS: outdoor.backgroundStart/Middle/End were defined
      # for AnimatedBackground and consumed by nothing, so dark mode drew
      # #0A1929 ink on a #050a12 gradient and every element without its own
      # surface went invisible on all ten screens.
      #
      # A palette that describes a surface nobody paints IS that bug, in one
      # line. Parse-only, so it runs beside the other two sweeps.
      - name: No unpainted keys in a pinned palette
        working-directory: frontend
        run: node scripts/find-unpinned-palette-keys.cjs

      # Globbed rather than hard-coded so a new *.test.cjs / *.test.js is
      # picked up automatically — a test nobody runs is the thing this workflow
      # exists to prevent. Runs EVERY file and fails the job with the full list,
      # and fails loudly if the glob ever matches nothing.
      - name: Run frontend JS tests
        working-directory: frontend
        run: |
          set -euo pipefail
          mapfile -t files < <(find src app -type f \( -name '*.test.cjs' -o -name '*.test.js' \) 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no frontend test files matched — the glob is stale."
            exit 1
          fi
          echo "Found ${#files[@]} test file(s):"
          printf '  %s\n' "${files[@]}"

          # EVERY FILE RUNS, AND EVERY FAILURE IS COLLECTED.
          #
          # This loop let `set -e` halt it at the first non-zero exit, so the
          # job reported ONE broken file when five were broken and said
          # nothing about the other 152. Each fix was then followed by another
          # red build and nobody could know how many were left.
          #
          # SAME FAILURE MODE THE NOTE ABOVE DESCRIBES for the two files that
          # needed @babel/core and had never executed in CI even once: the
          # gate reporting on a subset and saying nothing about the rest.
          #
          # AND IT COSTS NOTHING. All 157 files run in 12 seconds; this job
          # spends far longer on `npm ci` and the parse sweeps. Halting early
          # bought no time at all.
          failed=()
          for f in "${files[@]}"; do
            echo "--- $f"
            if ! node "$f"; then failed+=("$f"); fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo
            echo "FAILED: ${#failed[@]} of ${#files[@]} file(s)"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  # ── Mount smoke ────────────────────────────────────────────────────────────
  # The suite above PARSES component source; it never executes a component. That
  # gap shipped a real crash: four shared components kept a reference to a
  # `styles` const that no longer existed, and the frozen-ref grep, the wiring
  # checker and both suites were all green while the app died on first paint
  # with "Something went wrong - styles is not defined".
  #
  # This job loads real routes against the production export in a real browser
  # and fails on any console error or error-boundary render. It is deliberately
  # a SEPARATE job: the suite above is dependency-free and seconds long, and
  # this one needs npm ci + a Chromium download + an expo export (~5 min). Do
  # not merge them.
  frontend-mount-smoke:
    name: frontend mount smoke (playwright)
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # playwright-core is NOT a project dependency (nothing else needs a
      # browser); install it and the matching Chromium for this job only.
      # THE BROWSER, NOT THE BUNDLE. Measured on a real run, this job is 468s:
      # 356s of it is browser EXECUTION (mounting 78 routes in two themes, the
      # tap-target floor, and the three 443px gates) -- the actual testing, and
      # not compressible by caching. The cacheable setup is this step's 27s.
      #
      # npm IS ALREADY CACHED by `setup-node` above (`cache: "npm"`), so there
      # is no saving there; `npm ci` at 16s is already warm.
      #
      # THE EXPO EXPORT IS DELIBERATELY NOT CACHED. This job only runs when
      # `frontend/**` changed -- which is exactly when a cache keyed on frontend
      # content is stale. A key that hits would be a key that ignored the change
      # under test, which is worse than paying the 59s.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The pinned version is the whole key: a different playwright needs a
          # different browser build, and nothing else in the repo changes it.
          key: ms-playwright-chromium-1.49.1-${{ runner.os }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm i --no-save playwright-core@1.49.1
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # The browser is restored; `install-deps` is the apt half and is
            # NOT in the cache, so it still runs. `install chromium` becomes a
            # no-op that verifies the restore rather than re-downloading.
            npx --yes playwright@1.49.1 install-deps chromium
            npx --yes playwright@1.49.1 install chromium
          else
            npx --yes playwright@1.49.1 install --with-deps chromium
          fi

      - name: Build production web bundle
        working-directory: frontend
        run: npx expo export --platform web --output-dir dist

      - name: Mount every route, fail on console errors
        working-directory: frontend
        run: node scripts/smoke-mount.cjs --dist dist --port 5810

      # THE HALF THE MOUNT SMOKE CANNOT ASK. It proves every screen paints; it
      # does not press Next, so everything past step 1 of a four-step editor is
      # unexecuted -- which is where the 18pt disclosure row shipped. Reuses
      # the dist and the Chromium the step above already installed.
      - name: Every tap target clears the 56pt floor
        working-directory: frontend
        run: node scripts/touch-targets.cjs --dist dist --port 5811

      # WHICH BUTTONS A ROLE GETS, AND WHETHER THEIR LABELS FIT. A
      # superintendent's card carries Registration and no Assign — his projects
      # ARE his active registrations, so Assign would be a second writer of a
      # set that now has one owner. "Registration" is twelve characters where
      # "Assign" was six, and whether that wraps at the operator's 443px window
      # is the product of the font, the icon, the gap and the card width: not a
      # fact any source-text check can reach. Reuses the same dist and Chromium.
      - name: The user-card action row fits, and holds the right buttons
        working-directory: frontend
        run: node scripts/admin-users-card-actions.cjs --dist dist --port 5812
      # ── THE ONE SCREEN THE MOUNT SMOKE REPORTS ON WITHOUT SEEING ──────────
      #
      # '/admin/users' is in smoke-mount's ROUTES and has always been green
      # there, and that green was worth nothing: the job signs in as an OWNER
      # and the screen gates on `role === 'admin'`, so what mounted was the
      # "Admin Access Required" panel. The user list, the four openers and all
      # four forms were executed by NOTHING in CI -- which is how four forms
      # named `show*Modal` that were never modals rendered below the fold on a
      # phone for as long as they did.
      #
      # This step signs in as an admin, at the 443px width the report came
      # from, and measures where each form actually lands. It refuses (exit 2)
      # rather than reporting if it finds itself on the access-denied panel.
      # Reuses the same dist and Chromium as the two steps above.
      - name: The four /admin/users forms open over the viewport at 443px
        working-directory: frontend
        run: node scripts/admin-users-sheets.cjs --dist dist --port 5812

      # ── THE SHARED DATE FIELD, ON THE RECORD THAT STARTED IT ──────────────
      #
      # Opens Michael's account (stored expiry '07/212029') at 443px in both
      # themes: the field must read it as 07/21/2029 and send NOTHING on open
      # or close; 02/29/2027 must be named and not sent; Save must send ISO.
      # Then the scaffold stepper, whose LIGHT card is pinned whatever the
      # phone's theme, must show the field's message in legible ink -- the
      # white-on-white failure the mount smoke cannot see. Same dist/Chromium.
      - name: Date fields read, refuse and save as ruled
        working-directory: frontend
        run: node scripts/date-input-behaviour.cjs --dist dist --port 5813
