# poppler_utils: pdftoppm and pdfinfo. The plan indexer renders every page and
# every schedule crop through them, and _check_poppler refuses to start the
# index worker without both.
#
# libGL + glib: opencv, which rapidocr-onnxruntime imports to do anything at
# all. The wheel links libGL.so.1 and libglib-2.0.so.0 and this image carries
# neither, so `import cv2` raised ImportError on a container where every test
# passed and pip reported success. plan_ocr is written to treat an absent
# engine as a normal state, which is correct and is exactly why nothing failed
# loudly: the indexer would have run to completion and written ZERO schedule
# records for the sheets it exists to read.
#
# /health reports plan_ocr now, so this is visible without opening an SSH
# session to the container.
[phases.setup]
nixPkgs = ["poppler_utils", "libGL", "glib"]
